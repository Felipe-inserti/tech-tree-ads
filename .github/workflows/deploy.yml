name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Monta a pasta do site
        run: |
          mkdir _site
          cp -r index.html css js data _site/

      - name: Marca a versão para evitar cache antigo
        run: |
          V="${GITHUB_SHA::7}"
          echo "$V" > _site/versao.txt
          sed -i "s/export const VERSAO = \"dev\"/export const VERSAO = \"$V\"/" _site/js/versao.js
          sed -i -E "s#(\./[a-z]+\.js)\"#\1?v=$V\"#g" _site/js/*.js
          sed -i -E "s#(js/app\.js|css/style\.css)\"#\1?v=$V\"#g" _site/index.html
          grep -q "$V" _site/js/versao.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
